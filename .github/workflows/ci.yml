name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npm test
      - run: npm run test:desktop
      - run: python -m unittest backend.test_extraction backend.test_server backend.test_bundle_models backend.test_desktop
      - run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

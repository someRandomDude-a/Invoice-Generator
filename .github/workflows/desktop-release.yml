name: Desktop packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  model:
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-release.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m backend.bundle_models
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-laya
          path: .packaging/models/
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  package:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-14
            platform: macos
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: bundled-laya
          path: .packaging/models
      - run: npm ci
      - run: npm run desktop:install
      - name: Install CPU-only PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install native build runtime
        run: python -m pip install --no-cache-dir -r backend/requirements-build.txt
      - name: Freeze model runner and retain dependency licenses
        run: |
          python -m pip check
          python -m PyInstaller --noconfirm --clean --distpath .packaging/runtime --workpath .packaging/build packaging/runner.spec
          pip-licenses --format=json --with-license-file --no-license-path --output-file=.packaging/python-licenses.json
          python -m pip freeze > .packaging/python-versions.txt
      - name: Build unpacked desktop app
        run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged offline extraction (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run desktop:smoke
      - name: Verify packaged offline extraction (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
      - name: Build installers and standalone packages
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify final desktop app (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run desktop:smoke
      - name: Verify final desktop app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - run: npm run release:checksums
      - name: Create draft release with all verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            node -e "if (!JSON.parse(require('fs').readFileSync('existing-release.json')).isDraft) throw new Error('Refusing to overwrite a published release');"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Invoice Studio $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
